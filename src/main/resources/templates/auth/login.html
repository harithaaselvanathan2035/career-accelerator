<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerAI Login</title>

    <link rel="stylesheet" href="/css/auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>🚀 CareerAI</h1>

        <h2>Accelerate Your Career With AI</h2>

        <p>
            Build Resume • ATS Analysis • AI Interviews
        </p>

    </div>

    <div class="right">

        <div class="glass-card">

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required>

                <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
