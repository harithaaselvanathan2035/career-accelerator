<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career AI - Profile</title>

    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

<div class="container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="profile-photo-section">

                <img
                        id="profileImage"
                        src="/images/default-avatar.png"
                        alt="Profile Photo"
                        class="profile-photo">

                <input
                        type="file"
                        id="photoUpload"
                        accept="image/*">

            </div>

            <div class="profile-info">

                <h1 id="displayName">User Name</h1>

                <p id="displayEmail">user@email.com</p>

                <div class="button-group">

                    <button id="dashboardBtn"
                            class="dashboard-btn">
                        Dashboard
                    </button>

                    <button id="editBtn"
                            class="edit-btn">
                        Edit Profile
                    </button>

                    <button id="saveBtn"
                            class="save-btn">
                        Save Profile
                    </button>

                </div>
            </div>

        </div>

        <div class="profile-form">

            <div class="form-group">
                <label>Full Name</label>
                <input id="fullName" disabled>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input id="email" disabled>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input id="phone" disabled>
            </div>

            <div class="form-group">
                <label>Profession</label>

                <select id="profession" disabled>

                    <option>Student</option>
                    <option>Software Developer</option>
                    <option>Frontend Developer</option>
                    <option>Backend Developer</option>
                    <option>Full Stack Developer</option>
                    <option>Data Analyst</option>
                    <option>Data Scientist</option>
                    <option>AI Engineer</option>
                    <option>Cyber Security Analyst</option>

                </select>
            </div>

            <div class="form-group">
                <label>Current Role</label>
                <input id="currentRole" disabled>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input id="location" disabled>
            </div>

            <div class="form-group full-width">
                <label>Skills</label>
                <textarea id="skills" disabled></textarea>
            </div>

            <div class="form-group">
                <label>Experience</label>
                <input id="experience" disabled>
            </div>

            <div class="form-group">
                <label>Education</label>
                <input id="education" disabled>
            </div>

            <div class="form-group">
                <label>College</label>
                <input id="college" disabled>
            </div>

            <div class="form-group">
                <label>Website</label>
                <input id="website" disabled>
            </div>

            <div class="form-group">
                <label>LinkedIn</label>
                <input id="linkedin" disabled>
            </div>

            <div class="form-group">
                <label>GitHub</label>
                <input id="github" disabled>
            </div>

            <div class="form-group full-width">
                <label>Portfolio</label>
                <input id="portfolio" disabled>
            </div>

            <div class="form-group full-width">
                <label>About Me</label>
                <textarea id="aboutMe" disabled></textarea>
            </div>

        </div>

    </div>

</div>

<script src="/js/profile.js"></script>

</body>
</html>
