<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career Roadmap</title>

    <link rel="stylesheet"
          href="/css/roadmap.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Career Accelerator
    </div>

    <button class="dashboard-btn"
            onclick="window.location.href='/dashboard'">

        Dashboard

    </button>

</nav>

<section class="hero">

    <h1>
        AI Career Roadmap Generator
    </h1>

    <p>
        Generate a roadmap for any career domain.
    </p>

</section>

<div class="container">

    <div class="form-card">

        <h2>Create Roadmap</h2>

        <input
                type="text"
                id="role"
                placeholder="Enter Domain (Example: AI Engineer, Data Science, DevOps, Cyber Security)">

        <select id="level">

            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>

        </select>

        <button onclick="generateRoadmap()">

            Generate Roadmap

        </button>

    </div>

    <div id="roadmapResult"></div>

</div>

<script src="/js/roadmap.js"></script>

</body>
</html>
